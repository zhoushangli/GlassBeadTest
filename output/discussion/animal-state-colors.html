<div id="animal-state-colors" aria-label="羊群模拟的角色形状与行为配色提案">
  <style>
    #animal-state-colors { font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.5; color: light-dark(#24372d, #e6eee8); }
    #animal-state-colors * { box-sizing: border-box; }
    #animal-state-colors .species { margin: 0 0 20px; }
    #animal-state-colors .species-name { margin: 0 0 8px; font-size: 14px; font-weight: 500; }
    #animal-state-colors .states { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; background: light-dark(#edf2eb, #19271f); padding: 16px 8px; }
    #animal-state-colors .state { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; }
    #animal-state-colors .mark-area { display: grid; place-items: center; height: 44px; width: 48px; }
    #animal-state-colors .mark { width: 28px; height: 28px; background: var(--state-fill); }
    #animal-state-colors .sheep { border-radius: 50%; }
    #animal-state-colors .wolf { width: 34px; height: 30px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    #animal-state-colors .hex { font-size: 12px; color: light-dark(#53665a, #a9bdb0); font-variant-numeric: tabular-nums; }
    #animal-state-colors .death { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px; background: light-dark(#edf2eb, #19271f); }
    #animal-state-colors .death .mark { width: 20px; height: 20px; }
    @media (max-width: 420px) { #animal-state-colors .states { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; } }
  </style>
  <section class="species" aria-label="牧羊犬，蓝色正方形">
    <h3 class="species-name">牧羊犬 · 正方形 · 蓝色系</h3>
    <div class="states">
      <div class="state"><div class="mark-area"><div class="mark" style="--state-fill: #3B82F6" aria-hidden="true"></div></div><span>守护 / 巡逻</span><span class="hex">#3B82F6</span></div>
      <div class="state"><div class="mark-area"><div class="mark" style="--state-fill: #22B8F0" aria-hidden="true"></div></div><span>拦截</span><span class="hex">#22B8F0</span></div>
      <div class="state"><div class="mark-area"><div class="mark" style="--state-fill: #2563EB" aria-hidden="true"></div></div><span>驱赶</span><span class="hex">#2563EB</span></div>
      <div class="state"><div class="mark-area"><div class="mark" style="--state-fill: #93C5FD" aria-hidden="true"></div></div><span>返回羊群</span><span class="hex">#93C5FD</span></div>
    </div>
  </section>
  <section class="species" aria-label="羊，黄绿色圆形">
    <h3 class="species-name">羊 · 圆形 · 黄绿色系</h3>
    <div class="states">
      <div class="state"><div class="mark-area"><div class="mark sheep" style="--state-fill: #B8D94B" aria-hidden="true"></div></div><span>结群 / 闲逛</span><span class="hex">#B8D94B</span></div>
      <div class="state"><div class="mark-area"><div class="mark sheep" style="--state-fill: #D9E66B" aria-hidden="true"></div></div><span>寻找草地</span><span class="hex">#D9E66B</span></div>
      <div class="state"><div class="mark-area"><div class="mark sheep" style="--state-fill: #7CB342" aria-hidden="true"></div></div><span>进食</span><span class="hex">#7CB342</span></div>
      <div class="state"><div class="mark-area"><div class="mark sheep" style="--state-fill: #FACC15" aria-hidden="true"></div></div><span>逃跑</span><span class="hex">#FACC15</span></div>
    </div>
  </section>
  <section class="species" aria-label="狼，红色三角形">
    <h3 class="species-name">狼 · 三角形 · 红色系</h3>
    <div class="states">
      <div class="state"><div class="mark-area"><div class="mark wolf" style="--state-fill: #EF5350" aria-hidden="true"></div></div><span>搜索猎物</span><span class="hex">#EF5350</span></div>
      <div class="state"><div class="mark-area"><div class="mark wolf" style="--state-fill: #FF7043" aria-hidden="true"></div></div><span>追逐 / 协作追捕</span><span class="hex">#FF7043</span></div>
      <div class="state"><div class="mark-area"><div class="mark wolf" style="--state-fill: #F43F5E" aria-hidden="true"></div></div><span>捕食</span><span class="hex">#F43F5E</span></div>
      <div class="state"><div class="mark-area"><div class="mark wolf" style="--state-fill: #FCA5A5" aria-hidden="true"></div></div><span>躲避牧羊犬</span><span class="hex">#FCA5A5</span></div>
    </div>
  </section>
  <div class="death" aria-label="羊死亡反馈，灰色圆形，颜色 #7B8794">
    <div class="mark sheep" style="--state-fill: #7B8794" aria-hidden="true"></div>
    <span>羊被捕食：短暂灰色反馈</span><span class="hex">#7B8794</span>
  </div>
</div>
